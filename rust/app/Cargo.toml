profile = { release.lto = true, release.codegen-units = 1 }
dev-dependencies = { trycmd = "1" }
[package]
name = "termux-sync-rs"
version = "2.0.0"
edition = "2024"
publish = false
description = "Rust front door for termux-sync: Rust owns the entry point, the original answers what is not ported yet"
rust-version = "1.97"

[[bin]]
name = "termux-sync-rs"
path = "src/main.rs"

[dependencies]
clap = "4"
serde_json = "1"
termux-sync-core = { path = "../termux-sync-core" }

[workspace]
